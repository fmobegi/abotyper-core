name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.13" ]; then pip install -r tests/requirements-pinned.txt; fi
          pip install -e ".[test]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
